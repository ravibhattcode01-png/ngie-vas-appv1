name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: flutter create . --org com.ngie --project-name ngie_vas_app --platforms=android

      - name: Bump Kotlin plugin version
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/(org\.jetbrains\.kotlin\.android"?\)? version )"[0-9.]+"/\1"1.9.25"/' android/settings.gradle
          fi
          if [ -f android/settings.gradle.kts ]; then
            sed -i -E 's/(org\.jetbrains\.kotlin\.android"?\)? version )"[0-9.]+"/\1"1.9.25"/' android/settings.gradle.kts
          fi

      - name: Add INTERNET permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's#<manifest\(.*\)>#<manifest\1>\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$MANIFEST"
          fi

      - name: Set minSdk to 21 (required by Razorpay)
        run: |
          find android -name "build.gradle*" -exec sed -i 's/flutter.minSdkVersion/21/g' {} +

      - name: Install packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngie-vas-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
